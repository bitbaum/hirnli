name: Deploy

# Push to main → deploy revamp-info.orangecat.ch to bitbaum. All the logic lives
# in one place: catomean/fleetcrown/.github/workflows/selfhost-deploy.yml
# (docs: docs/infrastructure/self-host-cd.md there). It waits for this commit's
# own CI to go green before anything reaches the box.
#
# NB: this repo is `hirnli` on GitHub but serves the app registered in
# apps.conf as `revamp-info` — the `app:` value below is the apps.conf key.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  deploy:
    uses: catomean/fleetcrown/.github/workflows/selfhost-deploy.yml@main
    with:
      app: revamp-info
    secrets: inherit
