# Golden CI floor — see dotfiles/templates/ci/README.md.
# revamp-info: npm + vitest. Was gating tsc+lint+build but NOT running the vitest
# suite — this adds the missing Test gate and the Swiss-German umlaut lint.
# Build uses the repo's own SKIP_SYNC escape hatch: `prebuild` runs a DB sync
# (tsx sync-foundations.ts) that isn't hermetic; the generated data file is
# committed, so SKIP_SYNC=true compiles the real Next.js build without a DB.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Swiss-German umlaut lint (ß → ss)
        run: npm run lint:umlauts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        env:
          SKIP_SYNC: "true"
        run: npm run build
