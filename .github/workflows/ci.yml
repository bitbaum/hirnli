# Golden CI floor — see dotfiles/templates/ci/README.md.
# revamp-info: npm + vitest. Was gating tsc+lint+build but NOT running the vitest
# suite — this adds the missing Test gate and the Swiss-German umlaut lint.
# Foundation data reads go through a runtime DB read layer (unstable_cache)
# now, not a build-time sync — the build itself needs no DB access.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No version input: pnpm/action-setup reads packageManager from package.json.
      - uses: pnpm/action-setup@v6

      # The action's default store nests inside its own bin dir; a git-dep
      # prepare build then dies with TS2742. Pin the store somewhere sane.
      - name: Set pnpm store dir
        run: pnpm config set store-dir ~/.pnpm-store --global

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # SSOT: one definition of "verified" (lint + umlaut lint + typecheck +
      # test) lives in package.json `verify`, run identically here and locally.
      - name: Verify
        run: pnpm run verify

      - name: Build
        run: pnpm run build
