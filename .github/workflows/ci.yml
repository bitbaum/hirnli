# Golden CI floor — see dotfiles/templates/ci/README.md.
# revamp-info: npm + vitest. Was gating tsc+lint+build but NOT running the vitest
# suite — this adds the missing Test gate and the Swiss-German umlaut lint.
# Build uses the repo's own SKIP_SYNC escape hatch: `prebuild` runs a DB sync
# (tsx sync-foundations.ts) that isn't hermetic; the generated data file is
# committed, so SKIP_SYNC=true compiles the real Next.js build without a DB.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # SSOT: one definition of "verified" (lint + umlaut lint + typecheck +
      # test) lives in package.json `verify`, run identically here and locally.
      - name: Verify
        run: npm run verify

      - name: Build
        env:
          SKIP_SYNC: "true"
        run: npm run build
